<!DOCTYPE html>
<html lang="it">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Arbhorea Operatrice Olistica - AR</title>

  <!-- Libreria A-Frame 1.4.2 per compatibilità mobile -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- Libreria MindAR (CSS e JS) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.css">
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Messaggio dinamico in basso */
    #instructions {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      z-index: 1000;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="instructions">Inquadra il logo target</div>

  <!-- autoStart: true avvia direttamente la fotocamera richiedendo il permesso -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: yes;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="logoTexture" src="./logo.png">
    </a-assets>

    <a-camera 
      position="0 0 0" 
      look-controls="enabled: false" 
      cursor="fuse: false; rayOrigin: mouse" 
      raycaster="far: 10000; objects: .clickable">
    </a-camera>

    <!-- Target AR (targetIndex: 0) -->
    <a-entity id="example-target" mindar-image-target="targetIndex: 0">
      
      <a-plane 
        id="ar-logo"
        class="clickable"
        src="#logoTexture" 
        position="0 0 0" 
        height="1" 
        width="1" 
        rotation="0 0 0"
        material="transparent: true; alphaTest: 0.5">
      </a-plane>

    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const logoEl = document.getElementById('ar-logo');
      const targetEl = document.getElementById('example-target');
      const instructions = document.getElementById('instructions');

      // URL YouTube esatto visibile dallo screenshot del canale Arbhorea
      const youtubeUrl = 'https://www.youtube.com/@Arbhorea';

      const openYouTube = () => {
        window.location.href = youtubeUrl;
      };

      // Gestione del tocco su dispositivo mobile
      logoEl.addEventListener('click', openYouTube);
      logoEl.addEventListener('touchstart', openYouTube);

      // Aggiornamento del testo di aiuto
      targetEl.addEventListener("targetFound", () => {
        instructions.innerText = "Tocca il logo per aprire il canale YouTube";
      });

      targetEl.addEventListener("targetLost", () => {
        instructions.innerText = "Inquadra il logo target";
      });
    });
  </script>
</body>
</html>
