<!DOCTYPE html>
<html lang="it">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Arbhorea Operatrice Olistica - AR</title>

  <!-- Libreria A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- Libreria MindAR (JS e CSS ufficiale) -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Schermata iniziale obbligatoria per sbloccare la fotocamera su iOS e Android */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #start-btn {
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      background-color: #8E44AD;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      margin-top: 20px;
    }

    /* Messaggio informativo in basso */
    #instructions {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      z-index: 1000;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Schermata di avvio -->
  <div id="start-overlay">
    <h2 style="margin-bottom: 10px;">Arbhorea Operatrice Olistica</h2>
    <p style="margin: 0; font-size: 15px; opacity: 0.9;">Tocca il pulsante per attivare la fotocamera</p>
    <button id="start-btn">AVVIA FOTOCAMERA</button>
  </div>

  <div id="instructions">Inquadra il logo target</div>

  <!-- Scena AR -->
  <a-scene 
    mindar-image="imageTargetSrc: ./target.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: yes;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Logo in AR -->
      <img id="logoTexture" src="./logo.png">
    </a-assets>

    <a-camera 
      position="0 0 0" 
      look-controls="enabled: false" 
      cursor="fuse: false; rayOrigin: mouse" 
      raycaster="far: 10000; objects: .clickable">
    </a-camera>

    <!-- Target AR (targetIndex: 0) -->
    <a-entity id="example-target" mindar-image-target="targetIndex: 0">
      
      <!-- Logo 3D AR cliccabile -->
      <a-plane 
        id="ar-logo"
        class="clickable"
        src="#logoTexture" 
        position="0 0 0" 
        height="1" 
        width="1" 
        rotation="0 0 0"
        material="transparent: true; alphaTest: 0.5">
      </a-plane>

    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const startBtn = document.getElementById('start-btn');
      const startOverlay = document.getElementById('start-overlay');
      const sceneEl = document.querySelector('a-scene');
      const logoEl = document.getElementById('ar-logo');
      const targetEl = document.getElementById('example-target');
      const instructions = document.getElementById('instructions');

      const youtubeUrl = 'https://www.youtube.com/@arbhoreaoperatriceolistica';

      // Avvio fotocamera dopo interazione utente
      const startAR = () => {
        startOverlay.style.display = 'none';
        const arSystem = sceneEl.systems["mindar-image-system"];
        if (arSystem) {
          arSystem.start();
        }
      };

      startBtn.addEventListener('click', startAR);
      startBtn.addEventListener('touchstart', startAR);

      // Reindirizzamento al canale YouTube al tocco del logo 3D
      const openYouTube = () => {
        window.location.href = youtubeUrl;
      };

      logoEl.addEventListener('click', openYouTube);
      logoEl.addEventListener('touchstart', openYouTube);

      // Eventi di rilevamento target
      targetEl.addEventListener("targetFound", () => {
        instructions.innerText = "Tocca il logo per aprire il canale YouTube";
      });

      targetEl.addEventListener("targetLost", () => {
        instructions.innerText = "Inquadra il logo target";
      });
    });
  </script>
</body>
</html>
