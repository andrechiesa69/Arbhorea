<!DOCTYPE html>
<html lang="it">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Arbhorea Operatrice Olistica - AR</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Message overlay in basso */
    #instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      z-index: 1000;
      pointer-events: none;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div id="instructions">Inquadra il logo target per interagire</div>

  <!-- Scena AR con avvio automatico della fotocamera -->
  <a-scene 
    mindar-image="imageTargetSrc: ./target.mind; autoStart: true; uiLoading: yes; uiError: yes; uiScanning: yes;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Logo da sovrapporre -->
      <img id="logoTexture" src="./logo.png">
    </a-assets>

    <!-- Camera con Raycaster abilitato per il click touch -->
    <a-camera 
      position="0 0 0" 
      look-controls="enabled: false" 
      raycaster="objects: .clickable; far: 10000" 
      cursor="fuse: false; rayOrigin: mouse">
    </a-camera>

    <!-- Target AR (targetIndex: 0) -->
    <a-entity id="example-target" mindar-image-target="targetIndex: 0">
      
      <!-- Piano contenente il logo (Cliccabile) -->
      <a-plane 
        id="ar-logo"
        class="clickable"
        src="#logoTexture" 
        position="0 0 0" 
        height="1" 
        width="1" 
        rotation="0 0 0"
        material="transparent: true; alphaTest: 0.5">
      </a-plane>

    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const logoEl = document.getElementById('ar-logo');
      const targetEl = document.getElementById('example-target');
      const instructions = document.getElementById('instructions');

      const targetUrl = 'https://www.youtube.com/@arbhoreaoperatriceolistica';

      // Funzione per aprire il link YouTube
      const openLink = () => {
        window.location.href = targetUrl;
      };

      // Gestione evento click/touch nativo di A-Frame
      logoEl.addEventListener('click', openLink);
      logoEl.addEventListener('touchstart', openLink);

      // Aggiornamento messaggio quando il target viene trovato o perso
      targetEl.addEventListener("targetFound", () => {
        instructions.innerText = "Tocca il logo per aprire il canale YouTube";
      });

      targetEl.addEventListener("targetLost", () => {
        instructions.innerText = "Inquadra il logo target per interagire";
      });
    });
  </script>
</body>
</html>
