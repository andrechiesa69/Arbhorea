<!DOCTYPE html>
<html lang="it">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Arbhorea Operatrice Olistica - AR</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Schermata trasparente per autorizzare la fotocamera con un tocco */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      cursor: pointer;
    }

    #start-overlay h2 {
      margin-bottom: 10px;
      font-size: 22px;
    }

    #start-overlay p {
      font-size: 16px;
      opacity: 0.9;
    }

    /* Messaggio di stato in basso */
    #instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 1000;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Overlay per sbloccare la fotocamera su iOS e Android -->
  <div id="start-overlay">
    <h2>Arbhorea Operatrice Olistica</h2>
    <p>Tocca ovunque sullo schermo per avviare la fotocamera</p>
  </div>

  <div id="instructions">Inquadra il logo target</div>

  <!-- Scena AR -->
  <a-scene 
    mindar-image="imageTargetSrc: ./target.mind; autoStart: false; uiLoading: yes; uiError: yes; uiScanning: yes;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Logo che appare in Realtà Aumentata -->
      <img id="logoTexture" src="./logo.png">
    </a-assets>

    <a-camera 
      position="0 0 0" 
      look-controls="enabled: false" 
      cursor="fuse: false; rayOrigin: mouse" 
      raycaster="far: 10000; objects: .clickable">
    </a-camera>

    <!-- Target AR (targetIndex: 0) -->
    <a-entity id="example-target" mindar-image-target="targetIndex: 0">
      
      <!-- Piano con l'immagine del logo (Cliccabile) -->
      <a-plane 
        id="ar-logo"
        class="clickable"
        src="#logoTexture" 
        position="0 0 0" 
        height="1" 
        width="1" 
        rotation="0 0 0"
        material="transparent: true; alphaTest: 0.5">
      </a-plane>

    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const startOverlay = document.getElementById('start-overlay');
      const sceneEl = document.querySelector('a-scene');
      const logoEl = document.getElementById('ar-logo');
      const targetEl = document.getElementById('example-target');
      const instructions = document.getElementById('instructions');

      const youtubeUrl = 'https://www.youtube.com/@arbhoreaoperatriceolistica';

      // Al primo tocco dello schermo si avvia la fotocamera e l'interfaccia di scansione
      const startAR = () => {
        startOverlay.style.display = 'none';
        const arSystem = sceneEl.systems["mindar-image-system"];
        if (arSystem) {
          arSystem.start();
        }
      };

      startOverlay.addEventListener('click', startAR);
      startOverlay.addEventListener('touchstart', startAR);

      // Reindirizzamento al canale YouTube al tocco del logo 3D
      const openYouTube = () => {
        window.location.href = youtubeUrl;
      };

      logoEl.addEventListener('click', openYouTube);
      logoEl.addEventListener('touchstart', openYouTube);

      // Gestione eventi di tracciamento
      targetEl.addEventListener("targetFound", () => {
        instructions.innerText = "Tocca il logo per aprire YouTube";
      });

      targetEl.addEventListener("targetLost", () => {
        instructions.innerText = "Inquadra il logo target";
      });
    });
  </script>
</body>
</html>
